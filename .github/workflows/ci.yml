name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install jsonschema
      - name: Schemas are valid
        run: python scripts/check-schemas.py
      - name: Generated .cursor/ is up to date
        run: python scripts/build-agents.py --check
      - name: Fixture products repo passes the trace check
        run: python scripts/traces.py check --all --repo tests/fixtures/products-repo
      - name: Worked example passes the trace, register and scorecard checks
        run: |
          python scripts/traces.py check --all --repo examples
          for f in examples/*/.po/register.jsonl; do python scripts/register.py check --register "$f"; done
          python scripts/scorecard.py check --repo examples
      - name: Tests
        run: python -m unittest discover -s tests -t tests -v
